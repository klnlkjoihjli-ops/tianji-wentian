function parseJSON(raw){
  try{
    let s=raw.replace(/```json|```/g,'').trim();
    const a=s.indexOf('{'),b=s.lastIndexOf('}');
    if(a>-1&&b>-1)s=s.slice(a,b+1);
    return JSON.parse(s);
  }catch{return null;}
}

// 智能渲染：数组→编号卡片，字符串→流式文字
function streamOrCards(el, data, delay){
  // 空值检测：隐藏整张卡片
  const isEmpty = !data || (Array.isArray(data) && data.length===0) || String(data).trim()==='';
  if(isEmpty){
    const card = el.closest('.card');
    if(card) card.classList.add('empty-card');
    return Promise.resolve();
  }
  if(Array.isArray(data) && data.length > 0){
    // 过滤空条目
    const items = data.filter(function(p){ return String(p).trim().length > 0; });
    if(items.length === 0){
      const card = el.closest('.card');
      if(card) card.classList.add('empty-card');
      return Promise.resolve();
    }
    return new Promise(function(res){
      setTimeout(function(){
        el.innerHTML = items.map(function(p,i){
          return '<div class="action-item">'
            +'<div class="action-num">'+(i+1)+'</div>'
            +'<div class="action-text">'+escapeHTML(String(p).trim())+'</div>'
            +'</div>';
        }).join('');
        res();
      }, delay||0);
    });
  }
  // 字符串：检测是否有序号，有则换行分段显示
  const text = String(data||'').trim();
  if(!text){
    const card = el.closest('.card');
    if(card) card.classList.add('empty-card');
    return Promise.resolve();
  }
  // 检测数字序号（1. 2. 3. 或 一、二、三）
  const hasNumbers = /[12345]\.|[一二三四五]、|第[一二三四五六][，、：:]/.test(text);
  if(hasNumbers){
    return new Promise(function(res){
      setTimeout(function(){
        // 在序号前插入换行分隔
        const parts = text.split(/(?=[23456]\.)|(?=[二三四五六]、)|(?=第[二三四五六][，、：:])/).map(function(s){return s.trim();}).filter(Boolean);
        if(parts.length >= 2){
          el.innerHTML = parts.map(function(p,i){
            return '<div class="action-item">'
              +'<div class="action-num">'+(i+1)+'</div>'
              +'<div class="action-text">'+escapeHTML(p.replace(/^[123456]\.\s*|^[一二三四五六]、\s*|^第[一二三四五六][，、：:]\s*/,'').trim())+'</div>'
              +'</div>';
          }).join('');
        } else {
          el.textContent = text;
        }
        res();
      }, delay||0);
    });
  }
  return stream(el, text, delay);
}

function stream(el,text,delay=0){
  return new Promise(res=>{
    el.innerHTML='';
    const cur=document.createElement('span');cur.className='cur';el.appendChild(cur);
    let i=0;
    const spd=Math.max(14,Math.min(36,Math.floor(1500/Math.max(text.length,1))));
    setTimeout(()=>{
      const iv=setInterval(()=>{
        if(i<text.length){el.insertBefore(document.createTextNode(text[i]),cur);i++;}
        else{clearInterval(iv);cur.remove();res();}
      },spd);
    },delay);
  });
}

function hexSVG(seed,color='#c9a84c'){
  let h='<div class="hex3d">';
  for(let i=5;i>=0;i--){
    const yang=((seed*(i+3)*2654435761)>>>0)%2===1;
    h+='<div class="hxl">';
    if(yang)h+=`<div class="hxyang" style="width:64px;background:${color};box-shadow:0 0 8px ${color}99"></div>`;
    else h+=`<div class="hxyin-l" style="width:27px;background:${color};box-shadow:0 0 6px ${color}88"></div><div class="hxgap"></div><div class="hxyin-r" style="width:27px;background:${color};box-shadow:0 0 6px ${color}88"></div>`;
    h+='</div>';
  }
  return h+'</div>';
}

function renderHeroFrame(box, meta) {

  const sources = Array.isArray(meta.sources) ? meta.sources : [];
  const scene = meta.scene || 'A';
  const parsed = meta.parsed || {};

  const frame = document.createElement('section');
  frame.className = 'hero-frame';
  frame.setAttribute('aria-label', (SCENE_LABELS_MAP[scene] || scene) + ' · AI 摘要');

  // 场景标签
  const tag = document.createElement('div');
  tag.className = 'hero-scene-tag';
  tag.textContent = SCENE_LABELS_MAP[scene] || scene;
  frame.appendChild(tag);

  // 典籍引用
  if (quote) {
    const q = document.createElement('div');
    q.className = 'hero-quote';
    q.textContent = '「' + quote + '」';
    frame.appendChild(q);
    const s = document.createElement('div');
    s.className = 'hero-source';
    s.textContent = source;
    frame.appendChild(s);
  }

  // 一句结论
  const conclusion = advisor.conclusion || '';
  if (conclusion) {
    const c = document.createElement('div');
    c.className = 'hero-conclusion';
    c.textContent = conclusion;
    frame.appendChild(c);
  }

  // 行动列表
  const actions = Array.isArray(advisor.actions) ? advisor.actions : [];
  if (actions.length) {
    const al = document.createElement('div');
    al.className = 'hero-actions';
    actions.forEach(function(item, i) {
      const a = document.createElement('div');
      a.className = 'hero-action';
      a.textContent = (i+1) + '. ' + item;
      al.appendChild(a);
    });
    frame.appendChild(al);
  }

  // 底部栏：来源 chips + 展开按钮
  const bar = document.createElement('div');
  bar.className = 'hero-bottom-bar';
  sources.forEach(function(src) {
    const chip = document.createElement('span');
    chip.className = 'source-chip';
    chip.textContent = src.source + (src.chapter ? ' · ' + src.chapter : '');

  if (!sources.length) {
    const chip = document.createElement('span');

  // 展开按钮（有场景字段时才显示）

    const v = parsed[f.key];

  });
  let expandSection = null;
  if (expandFields.length) {
    const expandBtn = document.createElement('button');
    expandBtn.className = 'hero-expand-btn';
    expandBtn.textContent = '▾ 查看詳細解讀';

        expandSection.appendChild(hr);
      }

      field.className = 'hero-field';
      const lbl = document.createElement('div');
      lbl.className = 'hero-field-label';
      lbl.textContent = f.label;
      const txt = document.createElement('div');
      txt.className = 'hero-field-text';
      txt.textContent = String(parsed[f.key]).trim();
      field.appendChild(lbl);
      field.appendChild(txt);
      expandSection.appendChild(field);
    });

      expandBtn.textContent = open ? '▴ 收起' : '▾ 查看詳細解讀';
    };
    bar.appendChild(expandBtn);
  }
  frame.appendChild(bar);
  if (expandSection) frame.appendChild(expandSection);

  // 反馈行

          const arr=JSON.parse(raw.slice(a,b+1));
          if(Array.isArray(arr)&&arr.length>0){

              return '<div class="action-item">'

      // 解析失败原样显示，不再尝试任何拆分
    });
  }catch(e){
    showErrorState(lastQ, function(){ renderScene(scene, lastQ); }, e);
  }
}

<script>
// ══ 登录逻辑 ══
(function(){
  const gate = document.getElementById('loginGate');
  const input = document.getElementById('lgInput');
  const btn = document.getElementById('lgBtn');
  const err = document.getElementById('lgErr');

  const storedToken=sessionStorage.getItem('tianji_auth');
  const storedExpiry=Number(sessionStorage.getItem('tianji_auth_exp')||0);

  window.requireLogin=function(){
    sessionStorage.removeItem('tianji_auth');
    sessionStorage.removeItem('tianji_auth_exp');
    gate.classList.remove('hide');
    gate.style.display='flex';
    btn.disabled=false;btn.textContent='入 門';
    err.textContent='登入已失效，請重新輸入密碼';
    input.value='';input.focus();
  };

  if(storedToken && storedExpiry>Date.now()){
    gate.style.display='none';
    return;
  }
  sessionStorage.removeItem('tianji_auth');
  sessionStorage.removeItem('tianji_auth_exp');

  // 回车触发登录
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  input.focus();

  window.doLogin = async function(){
    const pwd = input.value.trim();
    if(!pwd){ err.textContent='請輸入密碼'; return; }
    btn.disabled=true; btn.textContent='驗證中…'; err.textContent='';
    try{
      const res = await fetch('/api/auth',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password:pwd})
      });
      const data = await res.json();
      if(res.ok && data.token && data.expiresAt){
        sessionStorage.setItem('tianji_auth', data.token);
        sessionStorage.setItem('tianji_auth_exp', String(data.expiresAt));
        gate.classList.add('hide');
        setTimeout(()=>{ gate.style.display='none'; }, 500);
      } else {
        err.textContent = data.error || '密碼不正確';
        input.value=''; input.focus();
        btn.disabled=false; btn.textContent='入 門';
      }
    }catch(e){
      err.textContent='網絡異常，請重試';
      btn.disabled=false; btn.textContent='入 門';
    }
  };
})();
</script>
